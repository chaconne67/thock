# The one path Thock's installer is built, checked and released on: a clean Windows machine
# with no Python, like a new user's PC.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The pure logic (word fixes, speech level) must import and pass without Windows too.
  unit-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s tests -p "test_*.py"

  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Build app
        env:
          # PyInstaller built from source compiles its own launcher here. The prebuilt launcher is what antivirus
          # machine learning keeps flagging (Defender Trojan:Win32/Bearfoos.A!ml on 0.4.6 and 0.5.5).
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: uv run --with pyinstaller --no-binary-package pyinstaller pyinstaller --noconfirm --windowed --name Thock --add-data "thock/settings.html;thock" --add-data "thock/welcome.html;thock" --add-data "thock/recovery.html;thock" --add-data "thock/sounds;thock/sounds" --add-data "thock/fonts;thock/fonts" voicetype.py

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" installer\thock.iss
          if ($LASTEXITCODE) { throw "ISCC exit $LASTEXITCODE" }
          "installer: {0:N0} MB" -f ((Get-Item dist\Thock-setup-x64.exe).Length / 1MB)

      - name: Install as a user would (silent), it starts and stays running
        shell: pwsh
        run: |
          # -Wait would also wait for the Thock the installer starts; wait for the installer alone.
          $run = Start-Process dist\Thock-setup-x64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -PassThru
          $run.WaitForExit()
          if ($run.ExitCode) { throw "installer exit $($run.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Thock\Thock.exe"
          if (-not (Test-Path $app)) { throw "Thock not installed at $app" }
          $soundDir = "$env:LOCALAPPDATA\Programs\Thock\_internal\thock\sounds"
          foreach ($sound in @("processing.wav", "ikki68-processing.wav", "hhkb-processing.wav")) {
            if (-not (Test-Path (Join-Path $soundDir $sound))) { throw "missing sound asset: $sound" }
          }
          $fonts = Get-ChildItem "$env:LOCALAPPDATA\Programs\Thock\_internal\thock\fonts\*.ttf"
          if ($fonts.Count -ne 7) { throw "expected 7 preview fonts, found $($fonts.Count)" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\Thock.lnk")) { throw "no startup shortcut" }
          Start-Sleep 15
          $log = Get-Content "$env:USERPROFILE\.voicetype\voicetype.log" -Raw -ErrorAction SilentlyContinue
          $log
          if (-not (Get-Process Thock -ErrorAction SilentlyContinue)) { throw "Thock is not running after install" }
          if ($log -notmatch "started, hotkey=") { throw "Thock did not log its start" }
          # Crema's mic finds a Thock running on its own by this file (its settings page's port and token).
          $control = Get-Content "$env:USERPROFILE\.voicetype\control.json" -Raw | ConvertFrom-Json
          $page = Invoke-WebRequest "http://127.0.0.1:$($control.port)/?t=$($control.token)&w=0" -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw "control.json does not lead to the settings page" }

      - name: Uninstall removes it
        shell: pwsh
        run: |
          (Start-Process "$env:LOCALAPPDATA\Programs\Thock\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -PassThru).WaitForExit()
          $app = "$env:LOCALAPPDATA\Programs\Thock\Thock.exe"
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          if (Test-Path $app) { throw "uninstall left $app" }
          if (Get-Process Thock -ErrorAction SilentlyContinue) { throw "Thock still running after uninstall" }

      - uses: actions/upload-artifact@v4
        with:
          name: Thock-setup-x64
          path: dist/Thock-setup-x64.exe

      - name: Verify company signature before public release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          foreach ($file in @("dist/Thock-setup-x64.exe", "dist/Thock/Thock.exe")) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid") {
              throw "Public release requires a valid company code signature: $file"
            }
          }

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match app version $version" }
          $sha = (Get-FileHash dist\Thock-setup-x64.exe -Algorithm SHA256).Hash.ToLower()
          $notes = "Built and verified on a clean Windows runner.`n`nSHA-256: ``$sha``"
          # Hand-written notes for this tag go on top when release-notes\<tag>.md exists.
          $file = "release-notes\$env:GITHUB_REF_NAME.md"
          if (Test-Path $file) { $notes = (Get-Content $file -Raw -Encoding utf8).TrimEnd() + "`n`n---`n`n" + $notes }
          Set-Content -Path release-notes.txt -Value $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME dist\Thock-setup-x64.exe --title "Thock $version" --notes-file release-notes.txt
